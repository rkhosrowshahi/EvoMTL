# MO-Aligned-MTL-OpenES on CQF2, the convex quadratic form, second variant, of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their protocol with the ES direction in place of the aggregated Jacobian: their initial points, SGD with
# lr = 0.125 (their rate for CQF2) x 4 (aggregator aligned_mtl), 200 iterations.
# Losses are >= 0 (no offset needed); the ES estimate of a quadratic's gradient is unbiased for any sigma.

name: MO-Aligned-MTL-OpenES
moea: mo_aligned_mtl_openes
problem:
  name: cqf2
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 200
  pop_size: 16
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.5
  optim: sgd
  sgd_momentum: 0.0
  fitness_shaping: raw
  antithetic: true
  aligned_mtl_scale_mode: min        # eigenvalue scaling the balance transformation (TorchJD default)
save_path: examples/toy/results/cqf2/evo/mo_aligned_mtl_openes/
