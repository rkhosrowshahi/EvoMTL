# GuidedES on CQF2, the convex quadratic form, second variant, of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their initial points with the Adam protocol of the Nash-MTL configs (configs/guidedes.yaml): Adam lr 1e-3 for
# every method, 35,000 iterations; the SGD protocol of the reference is configs/cqf2/guidedes.yaml.
# Losses are >= 0 (no offset needed).

name: GuidedES
moea: guidedes
problem:
  name: cqf2
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 35000
  pop_size: 16
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.001
  optim: adam
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-08
  fitness_shaping: raw
  antithetic: true
  guided_k: 1
  guided_alpha: 0.9
  guided_sigma: 0.05
  guided_ema: 0.9
save_path: examples/toy/logs/cqf2_adam/guidedes/
