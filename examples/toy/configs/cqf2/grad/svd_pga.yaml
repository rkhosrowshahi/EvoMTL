# SVD-PGA (gradient descent, LibMTL weighting SVD_PGA) on CQF2, the convex quadratic form, second variant.
# The protocol of configs/cqf2/evo/mo_svd_pga_openes.yaml (initial points, optimizer, learning rate, iterations) with
# SVD-PGA on the exact Jacobian instead of the ES estimate; deterministic, so one seed.
# SVD-PGA: average of the oriented, unit-norm principal directions of the gradients (TorchJD; rank 2, as its trajectory experiments).

name: SVD-PGA
weighting: SVD_PGA
weight_args:
  PGA_rank: 2
  PGA_scale: none
problem:
  name: cqf2
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 200
  optim: sgd
  lr: 0.125
  sgd_momentum: 0.0
save_path: examples/toy/results/cqf2/grad/svd_pga/
