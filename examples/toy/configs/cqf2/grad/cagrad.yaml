# CAGrad (gradient descent, LibMTL weighting CAGrad) on CQF2, the convex quadratic form, second variant.
# The protocol of configs/cqf2/evo/mo_cagrad_openes.yaml (initial points, optimizer, learning rate, iterations) with
# CAGrad on the exact Jacobian instead of the ES estimate; deterministic, so one seed.

name: CAGrad
weighting: CAGrad
weight_args:
  calpha: 0.5
  rescale: 1
problem:
  name: cqf2
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 200
  optim: sgd
  lr: 0.125
  sgd_momentum: 0.0
save_path: examples/toy/results/cqf2/grad/cagrad/
