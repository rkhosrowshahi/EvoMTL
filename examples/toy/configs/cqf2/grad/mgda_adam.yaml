# MGDA (gradient descent, LibMTL weighting MGDA) on CQF2, the convex quadratic form, second variant.
# The protocol of configs/cqf2/evo/mo_mgda_openes_adam.yaml (initial points, optimizer, learning rate, iterations) with
# MGDA on the exact Jacobian instead of the ES estimate; deterministic, so one seed.

name: MGDA
weighting: MGDA
weight_args:
  mgda_gn: none
problem:
  name: cqf2
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 35000
  optim: adam
  lr: 0.001
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-08
save_path: examples/toy/results/cqf2/grad/mgda_adam/
