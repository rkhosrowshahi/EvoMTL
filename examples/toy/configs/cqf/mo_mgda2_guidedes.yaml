# MO-MGDA2-GuidedES on CQF, the convex quadratic form (Eq. 14 of the UPGrad paper), of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their protocol with the ES direction in place of the aggregated Jacobian: their initial points, SGD with
# lr = 0.125 (their rate for CQF) x 2 (aggregator mgda), 200 iterations.
# Losses are >= 0 (no offset needed); the ES estimate of a quadratic's gradient is unbiased for any sigma.
# guided_sigma 0: noise budget of isotropic OpenES (s = sqrt((1 - alpha) D / k)). The estimate's mean is
# Cov(eps) grad; the 0.05 of the Nash-MTL configs (5 sigma along the guide) makes it ~26x the gradient
# along the guide, which Adam absorbs there but SGD at these learning rates does not (it diverges).
# MGDA2: MGDA after dropping the smallest pseudo-gradient while its norm is below drop_eps times the norm of the
# MGDA direction of the others (LibMTL/evomtl/moea/mo_mgda2_openes.py); otherwise as mo_mgda_guidedes.yaml.

name: MO-MGDA2-GuidedES
moea: mo_mgda2_guidedes
problem:
  name: cqf
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 200
  pop_size: 16
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.25
  optim: sgd
  sgd_momentum: 0.0
  fitness_shaping: raw
  antithetic: true
  drop_eps: 0.1                 # drop g_k while ||g_k|| < 0.1 ||MGDA direction of the others||
  guided_k: 1
  guided_alpha: 0.9
  guided_sigma: 0.0
  guided_ema: 0.9
save_path: examples/toy/logs/cqf/mo_mgda2_guidedes/
