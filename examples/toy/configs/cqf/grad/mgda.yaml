# MGDA (gradient descent, LibMTL weighting MGDA) on CQF, the convex quadratic form (Eq. 14 of the UPGrad paper).
# The protocol of configs/cqf/evo/mo_mgda_openes.yaml (initial points, optimizer, learning rate, iterations) with
# MGDA on the exact Jacobian instead of the ES estimate; deterministic, so one seed.

name: MGDA
weighting: MGDA
weight_args:
  mgda_gn: none
problem:
  name: cqf
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 200
  optim: sgd
  lr: 0.25
  sgd_momentum: 0.0
save_path: examples/toy/results/cqf/grad/mgda/
