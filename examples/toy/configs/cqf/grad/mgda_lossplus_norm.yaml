# MGDA (Loss+ Norm) (gradient descent, LibMTL weighting MGDA) on CQF, the convex quadratic form (Eq. 14 of the UPGrad paper).
# The protocol of configs/cqf/evo/mo_mgda_lossplus_norm_openes.yaml (initial points, optimizer, learning rate, iterations) with
# MGDA (Loss+ Norm) on the exact Jacobian instead of the ES estimate; deterministic, so one seed.
# MGDA with grad_norm loss+ (Sener & Koltun 2018; LibMTL's mgda_gn): each gradient divided by its loss times its norm.

name: MGDA (Loss+ Norm)
weighting: MGDA
weight_args:
  mgda_gn: loss+
problem:
  name: cqf
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 200
  optim: sgd
  lr: 0.25
  sgd_momentum: 0.0
save_path: examples/toy/results/cqf/grad/mgda_lossplus_norm/
