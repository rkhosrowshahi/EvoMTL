# EW (gradient descent, LibMTL weighting EW) on CQF, the convex quadratic form (Eq. 14 of the UPGrad paper).
# The protocol of configs/cqf/evo/openes.yaml (initial points, optimizer, iterations) with
# EW on the exact Jacobian instead of the ES estimate; deterministic, so one seed.
# Learning rate 0.125 / 2 = 0.0625: LibMTL's EW steps along the sum of the losses, the reference
# along the mean (Mean), so the steps are the reference's.

name: EW
weighting: EW
weight_args: {}
problem:
  name: cqf
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 200
  optim: sgd
  lr: 0.0625
  sgd_momentum: 0.0
save_path: examples/toy/results/cqf/grad/ew/
