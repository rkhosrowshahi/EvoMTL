# MGDA (L2 Norm) (gradient descent, LibMTL weighting MGDA) on the Valley-Bowl problem, scale 1.
# The protocol of configs/vb/evo/mo_mgda_l2_norm_openes.yaml (initial points, optimizer, learning rate, iterations) with
# MGDA (L2 Norm) on the exact Jacobian instead of the ES estimate; deterministic, so one seed.
# MGDA with grad_norm l2 (Sener & Koltun 2018; LibMTL's mgda_gn): each gradient divided by its norm.

name: MGDA (L2 Norm)
weighting: MGDA
weight_args:
  mgda_gn: l2
problem:
  name: vb
  loss_offset: 21.0
seeds: [1]
grad:
  num_iterations: 35000
  optim: adam
  lr: 0.001
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-08
save_path: examples/toy/results/vb/grad/mgda_l2_norm/
