# EW (gradient descent, LibMTL weighting EW) on the Valley-Bowl problem, scale 1.
# The protocol of configs/vb/evo/openes.yaml (initial points, optimizer, learning rate, iterations) with
# EW on the exact Jacobian instead of the ES estimate; deterministic, so one seed.

name: EW
weighting: EW
weight_args: {}
problem:
  name: vb
  loss_offset: 21.0
seeds: [1]
grad:
  num_iterations: 35000
  optim: adam
  lr: 0.001
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-08
save_path: examples/toy/results/vb/grad/ew/
