# GuidedES on the Nash-MTL toy problem (Navon et al. 2022, experiments/toy): OpenES on the sum of the two losses (single objective); Adam on the search mean.
# Same settings as openes.yaml plus Guided ES sampling along the moving average of past ES directions.
# Protocol of experiments/toy/trainer.py (five initial points, Adam lr 1e-3 on x, 35,000 iterations) without the
# scale on the first loss, as in Fig. 1 of Aligned-MTL (Senushkin et al., CVPR 2023).

name: GuidedES
moea: guidedes

# Toy problem
problem:
  scale: 1.0                    # no scale on the first loss (Aligned-MTL, CAGrad)
  loss_offset: 21.0             # added to both losses (> 0 everywhere); changes MO-MGDA(LN) only

seeds: [1, 2, 3]

# Evolution strategy: keyword arguments of the runner (LibMTL.evomtl.moea.run_guidedes)
es:
  num_iterations: 35000
  pop_size: 16
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.001
  optim: adam                   # optimizer on the search mean (sgd, adam or rmsprop); lr is its learning rate
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  fitness_shaping: raw          # keeps the size of each pseudo-gradient
  antithetic: true
  guided_k: 1                   # one guiding direction (the moving average below)
  guided_alpha: 0.9             # fraction of the noise budget kept isotropic
  guided_sigma: 0.05            # perturbation size along the guiding direction
  guided_ema: 0.9               # guide = moving average of past ES directions with this decay

# Paths (relative to the repository root)
save_path: examples/toy/logs/scale_1/guidedes/
