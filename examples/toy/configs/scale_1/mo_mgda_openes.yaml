# MO-MGDA-OpenES on the Nash-MTL toy problem (Navon et al. 2022, experiments/toy): one OpenES pseudo-gradient per objective (raw fitness), combined into the min-norm
# common descent direction d = -G^T alpha* (MGDA).
# Protocol of experiments/toy/trainer.py (five initial points, Adam lr 1e-3 on x, 35,000 iterations) without the
# scale on the first loss, as in Fig. 1 of Aligned-MTL (Senushkin et al., CVPR 2023).

name: MO-MGDA-OpenES
moea: mo_mgda_openes

# Toy problem
problem:
  scale: 1.0                    # no scale on the first loss (Aligned-MTL, CAGrad)
  loss_offset: 21.0             # added to both losses (> 0 everywhere); changes MO-MGDA(LN) only

seeds: [1, 2, 3]

# Evolution strategy: keyword arguments of the runner (LibMTL.evomtl.moea.run_mo_mgda_openes)
es:
  num_iterations: 35000
  pop_size: 16
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.001
  optim: adam                   # optimizer on the search mean (sgd, adam or rmsprop); lr is its learning rate
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  fitness_shaping: raw          # keeps the size of each pseudo-gradient
  antithetic: true
  direction: mgda               # min-norm common descent direction
  grad_norm: none               # no normalization
  stationary_tol: 0.05          # flag Pareto-stationary when ||d|| <= 0.05 max_j ||g_j||

# Paths (relative to the repository root)
save_path: examples/toy/logs/scale_1/mo_mgda_openes/
