# MO-UPGrad-OpenES on HQF, the homogeneous quadratic form (one matrix, scales 1 and 10), of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their protocol with the ES direction in place of the aggregated Jacobian: their initial points, SGD with
# lr = 0.005 (their rate for HQF) x 1 (aggregator upgrad), 100 iterations.
# Losses are >= 0 (no offset needed); the ES estimate of a quadratic's gradient is unbiased for any sigma.

name: MO-UPGrad-OpenES
moea: mo_upgrad_openes
problem:
  name: hqf
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 100
  pop_size: 16
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.005
  optim: sgd
  sgd_momentum: 0.0
  fitness_shaping: raw
  antithetic: true
  upgrad_norm_eps: 0.0001
  upgrad_reg_eps: 0.0001
save_path: examples/toy/logs/hqf/mo_upgrad_openes/
