# CAGrad (gradient descent, LibMTL weighting CAGrad) on HQF, the homogeneous quadratic form.
# The protocol of configs/hqf/evo/mo_cagrad_openes.yaml (initial points, optimizer, learning rate, iterations) with
# CAGrad on the exact Jacobian instead of the ES estimate; deterministic, so one seed.

name: CAGrad
weighting: CAGrad
weight_args:
  calpha: 0.5
  rescale: 1
problem:
  name: hqf
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 100
  optim: sgd
  lr: 0.005
  sgd_momentum: 0.0
save_path: examples/toy/results/hqf/grad/cagrad/
