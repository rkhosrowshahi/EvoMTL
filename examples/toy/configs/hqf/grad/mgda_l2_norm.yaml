# MGDA (L2 Norm) (gradient descent, LibMTL weighting MGDA) on HQF, the homogeneous quadratic form.
# The protocol of configs/hqf/evo/mo_mgda_l2_norm_openes.yaml (initial points, optimizer, learning rate, iterations) with
# MGDA (L2 Norm) on the exact Jacobian instead of the ES estimate; deterministic, so one seed.
# MGDA with grad_norm l2 (Sener & Koltun 2018; LibMTL's mgda_gn): each gradient divided by its norm.

name: MGDA (L2 Norm)
weighting: MGDA
weight_args:
  mgda_gn: l2
problem:
  name: hqf
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 100
  optim: sgd
  lr: 0.01
  sgd_momentum: 0.0
save_path: examples/toy/results/hqf/grad/mgda_l2_norm/
