# CAGrad (gradient descent, LibMTL weighting CAGrad) on the Valley-Bowl problem, scale 0.1 (Nash-MTL).
# The protocol of configs/vb01/evo/mo_cagrad_openes.yaml (initial points, optimizer, learning rate, iterations) with
# CAGrad on the exact Jacobian instead of the ES estimate; deterministic, so one seed.

name: CAGrad
weighting: CAGrad
weight_args:
  calpha: 0.5
  rescale: 1
problem:
  name: vb01
  loss_offset: 21.0
seeds: [1]
grad:
  num_iterations: 35000
  optim: adam
  lr: 0.001
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-08
save_path: examples/toy/results/vb01/grad/cagrad/
