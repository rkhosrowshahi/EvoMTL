# MO-GradNorm-OpenES on the Valley-Bowl (VB) problem (protocol of Nash-MTL's experiments/toy): one OpenES pseudo-gradient per objective (raw fitness), weighted by GradNorm.
# Protocol of experiments/toy/trainer.py: five initial points, Adam lr 1e-3 on x, 35,000 iterations, scale 0.1.

name: MO-GradNorm-OpenES
moea: mo_gradnorm_openes

# Toy problem
problem:
  name: vb01                    # Valley-Bowl, scale 0.1 on the first loss (Nash-MTL default)
  loss_offset: 21.0             # added to both losses (> 0 everywhere); GradNorm's training rates are ratios of the shifted losses

seeds: [1]

# Evolution strategy: keyword arguments of the runner (LibMTL.evomtl.moea.run_mo_gradnorm_openes)
es:
  num_iterations: 35000
  pop_size: 16
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.001
  optim: adam                   # optimizer on the search mean and on the GradNorm logits (sgd, adam or rmsprop)
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  fitness_shaping: raw          # keeps the size of each pseudo-gradient (GradNorm balances their norms)
  antithetic: true
  gradnorm_alpha: 1.5           # GradNorm: strength of the pull towards a common training rate (LibMTL default)

# Paths (relative to the repository root)
save_path: examples/toy/results/vb01/evo/mo_gradnorm_openes/
