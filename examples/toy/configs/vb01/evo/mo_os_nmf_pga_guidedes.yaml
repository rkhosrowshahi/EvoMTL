# MO-OS-NMF-PGA-GuidedES on the Valley-Bowl (VB) problem (protocol of Nash-MTL's experiments/toy): one OpenES pseudo-gradient per objective (raw fitness), combined by OS-NMF-PGA.
# Same settings as mo_os_nmf_pga_openes.yaml plus Guided ES sampling along the moving average of past ES directions.
# Protocol of experiments/toy/trainer.py: five initial points, Adam lr 1e-3 on x, 35,000 iterations, scale 0.1.
# OS-NMF-PGA: average of the columns of the orthogonal semi-NMF basis of the pseudo-gradients (ported from TorchJD).

name: MO-OS-NMF-PGA-GuidedES
moea: mo_os_nmf_pga_guidedes

# Toy problem
problem:
  name: vb01                    # Valley-Bowl, scale 0.1 on the first loss (Nash-MTL default)
  loss_offset: 21.0             # added to both losses (> 0 everywhere); changes MO-MGDA (Loss Norm) only

seeds: [1, 2, 3]

# Evolution strategy: keyword arguments of the runner (LibMTL.evomtl.moea.run_mo_os_nmf_pga_guidedes)
es:
  num_iterations: 35000
  pop_size: 16
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.001
  optim: adam                   # optimizer on the search mean (sgd, adam or rmsprop); lr is its learning rate
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  fitness_shaping: raw          # keeps the size of each pseudo-gradient
  antithetic: true
  guided_k: 1                   # one guiding direction (the moving average below)
  guided_alpha: 0.9             # fraction of the noise budget kept isotropic
  guided_sigma: 0.05            # perturbation size along the guiding direction
  guided_ema: 0.9               # guide = moving average of past ES directions with this decay
  pga_rank: 2                   # at most 2 principal directions (TorchJD trajectory experiments)
  pga_scale: none               # unit-scale direction (mean_norm: times the mean pseudo-gradient norm)

# Paths (relative to the repository root)
save_path: examples/toy/results/vb01/evo/mo_os_nmf_pga_guidedes/
