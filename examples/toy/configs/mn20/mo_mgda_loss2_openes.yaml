# MO-MGDA(LN2)-OpenES on MN20, the multinorm, a = (1, ..., 20), 20 objectives, of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their protocol with the ES direction in place of the aggregated Jacobian: their initial points, SGD with
# lr = 0.005 (their rate for MN20) x 2 (aggregator mgda), 500 iterations.
# Losses are >= 0 (no offset needed); the ES estimate of a quadratic's gradient is unbiased for any sigma.
# pop_size 64: with antithetic pairs the estimate of a quadratic's gradient is
# (1/n) sum_u eps_u eps_u^T grad, whose relative error grows as sqrt(D / n) (D = 20 here).
# MGDA(LN2): the direction of MGDA(LN) with the step weights alpha_k / L_k normalized to sum to one, a convex
# combination of the raw pseudo-gradients (grad_norm loss2); otherwise as mo_mgda_loss_openes.yaml.

name: MO-MGDA(LN2)-OpenES
moea: mo_mgda_openes
problem:
  name: mn20
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 500
  pop_size: 64
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.01
  optim: sgd
  sgd_momentum: 0.0
  fitness_shaping: raw
  antithetic: true
  direction: mgda
  grad_norm: loss2
  stationary_tol: 0.05
save_path: examples/toy/logs/mn20/mo_mgda_loss2_openes/
