# EW (gradient descent, LibMTL weighting EW) on MN20, the multinorm, a = (1, ..., 20), 20 objectives.
# The protocol of configs/mn20/evo/openes_adam.yaml (initial points, optimizer, learning rate, iterations) with
# EW on the exact Jacobian instead of the ES estimate; deterministic, so one seed.

name: EW
weighting: EW
weight_args: {}
problem:
  name: mn20
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 35000
  optim: adam
  lr: 0.001
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-08
save_path: examples/toy/results/mn20/grad/ew_adam/
