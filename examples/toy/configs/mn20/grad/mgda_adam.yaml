# MGDA (gradient descent, LibMTL weighting MGDA) on MN20, the multinorm, a = (1, ..., 20), 20 objectives.
# The protocol of configs/mn20/evo/mo_mgda_openes_adam.yaml (initial points, optimizer, learning rate, iterations) with
# MGDA on the exact Jacobian instead of the ES estimate; deterministic, so one seed.

name: MGDA
weighting: MGDA
weight_args:
  mgda_gn: none
problem:
  name: mn20
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 35000
  optim: adam
  lr: 0.001
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-08
save_path: examples/toy/results/mn20/grad/mgda_adam/
