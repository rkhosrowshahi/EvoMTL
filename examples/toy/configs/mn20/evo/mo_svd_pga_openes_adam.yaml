# MO-SVD-PGA-OpenES on MN20, the multinorm, a = (1, ..., 20), 20 objectives, of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their initial points with the Adam protocol of the Nash-MTL configs (configs/vb01/evo/mo_svd_pga_openes.yaml): Adam lr 1e-3 for
# every method, 35,000 iterations; the SGD protocol of the reference is configs/mn20/evo/mo_svd_pga_openes.yaml.
# Losses are >= 0 (no offset needed).
# pop_size 64 (D = 20), as in configs/mn20/evo/mo_svd_pga_openes.yaml.
# SVD-PGA: average of the oriented, unit-norm principal directions of the pseudo-gradients (ported from TorchJD).

name: MO-SVD-PGA-OpenES
moea: mo_svd_pga_openes
problem:
  name: mn20
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 35000
  pop_size: 64
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.001
  optim: adam
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-08
  fitness_shaping: raw
  antithetic: true
  pga_rank: 2                   # at most 2 principal directions (TorchJD trajectory experiments)
  pga_scale: none               # unit-scale direction (mean_norm: times the mean pseudo-gradient norm)
save_path: examples/toy/results/mn20/evo/mo_svd_pga_openes_adam/
