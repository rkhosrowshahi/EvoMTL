# MO-OS-NMF-PGA-OpenES on MN20, the multinorm, a = (1, ..., 20), 20 objectives, of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their protocol with the ES direction in place of the aggregated Jacobian: their initial points, SGD with
# lr = 0.005 (their rate for MN20) x 1 (aggregator os_nmf_pga), 500 iterations.
# Losses are >= 0 (no offset needed); the ES estimate of a quadratic's gradient is unbiased for any sigma.
# pop_size 64: with antithetic pairs the estimate of a quadratic's gradient is
# (1/n) sum_u eps_u eps_u^T grad, whose relative error grows as sqrt(D / n) (D = 20 here).
# OS-NMF-PGA: average of the columns of the orthogonal semi-NMF basis of the pseudo-gradients (ported from TorchJD).

name: MO-OS-NMF-PGA-OpenES
moea: mo_os_nmf_pga_openes
problem:
  name: mn20
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 500
  pop_size: 64
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.005
  optim: sgd
  sgd_momentum: 0.0
  fitness_shaping: raw
  antithetic: true
  pga_rank: 2                   # at most 2 principal directions (TorchJD trajectory experiments)
  pga_scale: none               # unit-scale direction (mean_norm: times the mean pseudo-gradient norm)
save_path: examples/toy/results/mn20/evo/mo_os_nmf_pga_openes/
