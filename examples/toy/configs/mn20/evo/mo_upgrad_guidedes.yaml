# MO-UPGrad-GuidedES on MN20, the multinorm, a = (1, ..., 20), 20 objectives, of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their protocol with the ES direction in place of the aggregated Jacobian: their initial points, SGD with
# lr = 0.005 (their rate for MN20) x 1 (aggregator upgrad), 500 iterations.
# Losses are >= 0 (no offset needed); the ES estimate of a quadratic's gradient is unbiased for any sigma.
# guided_sigma 0: noise budget of isotropic OpenES (s = sqrt((1 - alpha) D / k)). The estimate's mean is
# Cov(eps) grad; the 0.05 of the Nash-MTL configs (5 sigma along the guide) makes it ~26x the gradient
# along the guide, which Adam absorbs there but SGD at these learning rates does not (it diverges).
# pop_size 64: with antithetic pairs the estimate of a quadratic's gradient is
# (1/n) sum_u eps_u eps_u^T grad, whose relative error grows as sqrt(D / n) (D = 20 here).

name: MO-UPGrad-GuidedES
moea: mo_upgrad_guidedes
problem:
  name: mn20
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 500
  pop_size: 64
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.005
  optim: sgd
  sgd_momentum: 0.0
  fitness_shaping: raw
  antithetic: true
  upgrad_norm_eps: 0.0001
  upgrad_reg_eps: 0.0001
  guided_k: 1
  guided_alpha: 0.9
  guided_sigma: 0.0
  guided_ema: 0.9
save_path: examples/toy/logs/mn20/mo_upgrad_guidedes/
