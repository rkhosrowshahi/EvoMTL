# OS-NMF-PGA (gradient descent, LibMTL weighting OS_NMF_PGA) on MN2, the multinorm, a = (1, 10).
# The protocol of configs/mn2/evo/mo_os_nmf_pga_openes.yaml (initial points, optimizer, learning rate, iterations) with
# OS-NMF-PGA on the exact Jacobian instead of the ES estimate; deterministic, so one seed.
# OS-NMF-PGA: average of the columns of the orthogonal semi-NMF basis of the gradients (TorchJD; rank 2, as its trajectory experiments).

name: OS-NMF-PGA
weighting: OS_NMF_PGA
weight_args:
  PGA_rank: 2
  PGA_scale: none
problem:
  name: mn2
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 50
  optim: sgd
  lr: 0.02
  sgd_momentum: 0.0
save_path: examples/toy/results/mn2/grad/os_nmf_pga/
