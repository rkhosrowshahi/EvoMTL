# EW (gradient descent, LibMTL weighting EW) on MN2, the multinorm, a = (1, 10).
# The protocol of configs/mn2/evo/openes.yaml (initial points, optimizer, iterations) with
# EW on the exact Jacobian instead of the ES estimate; deterministic, so one seed.
# Learning rate 0.02 / 2 = 0.01: LibMTL's EW steps along the sum of the losses, the reference
# along the mean (Mean), so the steps are the reference's.

name: EW
weighting: EW
weight_args: {}
problem:
  name: mn2
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 50
  optim: sgd
  lr: 0.01
  sgd_momentum: 0.0
save_path: examples/toy/results/mn2/grad/ew/
