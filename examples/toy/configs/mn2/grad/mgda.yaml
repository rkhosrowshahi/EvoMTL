# MGDA (gradient descent, LibMTL weighting MGDA) on MN2, the multinorm, a = (1, 10).
# The protocol of configs/mn2/evo/mo_mgda_openes.yaml (initial points, optimizer, learning rate, iterations) with
# MGDA on the exact Jacobian instead of the ES estimate; deterministic, so one seed.

name: MGDA
weighting: MGDA
weight_args:
  mgda_gn: none
problem:
  name: mn2
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 50
  optim: sgd
  lr: 0.04
  sgd_momentum: 0.0
save_path: examples/toy/results/mn2/grad/mgda/
