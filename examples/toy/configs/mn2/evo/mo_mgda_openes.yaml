# MO-MGDA-OpenES on MN2, the multinorm, a = (1, 10), of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their protocol with the ES direction in place of the aggregated Jacobian: their initial points, SGD with
# lr = 0.02 (their rate for MN2) x 2 (aggregator mgda), 50 iterations.
# Losses are >= 0 (no offset needed); the ES estimate of a quadratic's gradient is unbiased for any sigma.

name: MO-MGDA-OpenES
moea: mo_mgda_openes
problem:
  name: mn2
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 50
  pop_size: 16
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.04
  optim: sgd
  sgd_momentum: 0.0
  fitness_shaping: raw
  antithetic: true
  direction: mgda
  grad_norm: none
  stationary_tol: 0.05
save_path: examples/toy/logs/mn2/mo_mgda_openes/
