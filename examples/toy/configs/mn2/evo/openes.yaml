# OpenES on MN2, the multinorm, a = (1, 10), of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their protocol with the ES direction in place of the aggregated Jacobian: their initial points, SGD with
# lr = 0.02 (their rate for MN2) x 1/2: the sum of the losses is 2 x their mean (aggregator mean: 1), 50 iterations.
# Losses are >= 0 (no offset needed); the ES estimate of a quadratic's gradient is unbiased for any sigma.

name: OpenES
moea: openes
problem:
  name: mn2
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 50
  pop_size: 16
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.01
  optim: sgd
  sgd_momentum: 0.0
  fitness_shaping: raw
  antithetic: true
save_path: examples/toy/logs/mn2/openes/
