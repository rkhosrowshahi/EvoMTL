# MO-MGDA2-OpenES on MN20, the multinorm, a = (1, ..., 20), 20 objectives, of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their initial points with the Adam protocol of the Nash-MTL configs (configs/mo_mgda2_openes.yaml): Adam lr 1e-3 for
# every method, 35,000 iterations; the SGD protocol of the reference is configs/mn20/mo_mgda2_openes.yaml.
# Losses are >= 0 (no offset needed).
# pop_size 64 (D = 20), as in configs/mn20/mo_mgda2_openes.yaml.
# MGDA2: MGDA after dropping the smallest pseudo-gradient while its norm is below drop_eps times the norm of the
# MGDA direction of the others (LibMTL/evomtl/moea/mo_mgda2_openes.py); otherwise as mo_mgda_openes.yaml.

name: MO-MGDA2-OpenES
moea: mo_mgda2_openes
problem:
  name: mn20
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 35000
  pop_size: 64
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.001
  optim: adam
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-08
  fitness_shaping: raw
  antithetic: true
  drop_eps: 0.1                 # drop g_k while ||g_k|| < 0.1 ||MGDA direction of the others||
save_path: examples/toy/logs/mn20_adam/mo_mgda2_openes/
