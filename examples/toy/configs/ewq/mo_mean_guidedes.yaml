# MO-Mean-GuidedES on EWQ, the element-wise quadratic f = (x1^2, x2^2), of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their protocol with the ES direction in place of the aggregated Jacobian: their initial points, SGD with
# lr = 0.075 (their rate for EWQ) x 1 (aggregator mean), 50 iterations.
# Losses are >= 0 (no offset needed); the ES estimate of a quadratic's gradient is unbiased for any sigma.
# guided_sigma 0: noise budget of isotropic OpenES (s = sqrt((1 - alpha) D / k)). The estimate's mean is
# Cov(eps) grad; the 0.05 of the Nash-MTL configs (5 sigma along the guide) makes it ~26x the gradient
# along the guide, which Adam absorbs there but SGD at these learning rates does not (it diverges).

name: MO-Mean-GuidedES
moea: mo_mean_guidedes
problem:
  name: ewq
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 50
  pop_size: 16
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.075
  optim: sgd
  sgd_momentum: 0.0
  fitness_shaping: raw
  antithetic: true
  guided_k: 1
  guided_alpha: 0.9
  guided_sigma: 0.0
  guided_ema: 0.9
save_path: examples/toy/logs/ewq/mo_mean_guidedes/
