# EW (gradient descent, LibMTL weighting EW) on EWQ, the element-wise quadratic.
# The protocol of configs/ewq/evo/openes_adam.yaml (initial points, optimizer, learning rate, iterations) with
# EW on the exact Jacobian instead of the ES estimate; deterministic, so one seed.

name: EW
weighting: EW
weight_args: {}
problem:
  name: ewq
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 35000
  optim: adam
  lr: 0.001
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-08
save_path: examples/toy/results/ewq/grad/ew_adam/
