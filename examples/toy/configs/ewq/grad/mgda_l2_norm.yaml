# MGDA (L2 Norm) (gradient descent, LibMTL weighting MGDA) on EWQ, the element-wise quadratic.
# The protocol of configs/ewq/evo/mo_mgda_l2_norm_openes.yaml (initial points, optimizer, iterations; the reference learning rate) with
# MGDA (L2 Norm) on the exact Jacobian instead of the ES estimate; deterministic, so one seed.
# MGDA with grad_norm l2 (Sener & Koltun 2018; LibMTL's mgda_gn): each gradient divided by its norm.

name: MGDA (L2 Norm)
weighting: MGDA
weight_args:
  mgda_gn: l2
problem:
  name: ewq
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 50
  optim: sgd
  lr: 0.15
  sgd_momentum: 0.0
save_path: examples/toy/results/ewq/grad/mgda_l2_norm/
