# MGDA (gradient descent, LibMTL weighting MGDA) on EWQ, the element-wise quadratic.
# The protocol of configs/ewq/evo/mo_mgda_openes.yaml (initial points, optimizer, iterations; the reference learning rate) with
# MGDA on the exact Jacobian instead of the ES estimate; deterministic, so one seed.

name: MGDA
weighting: MGDA
weight_args:
  mgda_gn: none
problem:
  name: ewq
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 50
  optim: sgd
  lr: 0.15
  sgd_momentum: 0.0
save_path: examples/toy/results/ewq/grad/mgda/
