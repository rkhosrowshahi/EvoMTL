# UPGrad (gradient descent, LibMTL weighting UPGrad) on EWQ, the element-wise quadratic.
# The protocol of configs/ewq/evo/mo_upgrad_openes.yaml (initial points, optimizer, iterations; the reference learning rate) with
# UPGrad on the exact Jacobian instead of the ES estimate; deterministic, so one seed.

name: UPGrad
weighting: UPGrad
weight_args:
  UPGrad_norm_eps: 0.0001
  UPGrad_reg_eps: 0.0001
problem:
  name: ewq
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 50
  optim: sgd
  lr: 0.075
  sgd_momentum: 0.0
save_path: examples/toy/results/ewq/grad/upgrad/
