# Aligned-MTL (gradient descent, LibMTL weighting Aligned_MTL) on EWQ, the element-wise quadratic.
# The protocol of configs/ewq/evo/mo_aligned_mtl_openes.yaml (initial points, optimizer, iterations; the reference learning rate) with
# Aligned-MTL on the exact Jacobian instead of the ES estimate; deterministic, so one seed.
# Learning rate 0.3 / 2 = 0.15: LibMTL's Aligned_MTL steps along B 1, the reference
# along B 1 / K, so the steps are the reference's.

name: Aligned-MTL
weighting: Aligned_MTL
weight_args: {}
problem:
  name: ewq
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 50
  optim: sgd
  lr: 0.15
  sgd_momentum: 0.0
save_path: examples/toy/results/ewq/grad/aligned_mtl/
