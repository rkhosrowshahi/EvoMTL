# EW (gradient descent, LibMTL weighting EW) on EWQ, the element-wise quadratic.
# The protocol of configs/ewq/evo/openes.yaml (initial points, optimizer, iterations) with
# EW on the exact Jacobian instead of the ES estimate; deterministic, so one seed.
# Learning rate 0.075 / 2 = 0.0375: LibMTL's EW steps along the sum of the losses, the reference
# along the mean (Mean), so the steps are the reference's.

name: EW
weighting: EW
weight_args: {}
problem:
  name: ewq
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 50
  optim: sgd
  lr: 0.0375
  sgd_momentum: 0.0
save_path: examples/toy/results/ewq/grad/ew/
