# SVD-PGA (gradient descent, LibMTL weighting SVD_PGA) on EWQ, the element-wise quadratic.
# The protocol of configs/ewq/evo/mo_svd_pga_openes.yaml (initial points, optimizer, iterations; the reference learning rate) with
# SVD-PGA on the exact Jacobian instead of the ES estimate; deterministic, so one seed.
# SVD-PGA: average of the oriented, unit-norm principal directions of the gradients (TorchJD; rank 2, as its trajectory experiments).

name: SVD-PGA
weighting: SVD_PGA
weight_args:
  PGA_rank: 2
  PGA_scale: none
problem:
  name: ewq
  loss_offset: 0.0
seeds: [1]
grad:
  num_iterations: 50
  optim: sgd
  lr: 0.3
  sgd_momentum: 0.0
save_path: examples/toy/results/ewq/grad/svd_pga/
