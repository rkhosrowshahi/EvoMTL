# MO-MGDA (Loss+ Norm)-GuidedES on EWQ, the element-wise quadratic f = (x1^2, x2^2), of the UPGrad trajectory plots
# (Quinton & Rey 2024, https://github.com/SimplexLab/trajectories; examples/toy/problems.py).
# Their initial points with the Adam protocol of the Nash-MTL configs (configs/vb01/evo/mo_mgda_guidedes.yaml): Adam lr 1e-3 for
# every method, 35,000 iterations; the SGD protocol of the reference is configs/ewq/evo/mo_mgda_guidedes.yaml.
# Losses are >= 0 (no offset needed).
# grad_norm loss+ (Sener & Koltun 2018; LibMTL's mgda_gn): each pseudo-gradient divided by its loss times its norm.

name: MO-MGDA (Loss+ Norm)-GuidedES
moea: mo_mgda_guidedes
problem:
  name: ewq
  loss_offset: 0.0
seeds: [1, 2, 3]
es:
  num_iterations: 35000
  pop_size: 16
  sigma: 0.01
  sigma_decay: 1.0
  sigma_min: 0.0
  lr: 0.001
  optim: adam
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-08
  fitness_shaping: raw
  antithetic: true
  direction: mgda
  grad_norm: loss+
  stationary_tol: 0.05
  guided_k: 1
  guided_alpha: 0.9
  guided_sigma: 0.05
  guided_ema: 0.9
save_path: examples/toy/results/ewq/evo/adam_lr1e-3/mo_mgda_lossplus_norm_guidedes/
