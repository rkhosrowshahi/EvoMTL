# 20-epoch protocol: 4688 generations x 256 images = 20 epochs (twice the 10-epoch PaMaL budget).
# MO-MGDA-Loss-OpenES: multi-objective OpenES with the MGDA common descent direction. One OpenES pseudo-gradient per objective
# (raw fitness), combined into the min-norm common descent direction d = -G^T alpha* (MGDA); Adam on the search mean.
# Same settings as configs/10epochs/.../mo_mgda_loss_openes/pop_128/adam-lr_0.001 apart from the budget (20 epochs) and pop_size 8192.

# General
mode: train
seed: 2
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is ES only

# Evolution strategy (MO-MGDA-OpenES); evo_moea selects the algorithm, evo_mgda_direction the common descent direction
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: mo_mgda_openes
evo_iterations: 4688        # 20 epochs: 4,688 generations x 256 images
evo_pop_size: 8192
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 2
evo_mgda_direction: mgda
evo_mgda_grad_norm: loss      # divide each pseudo-gradient by its loss before MGDA (LibMTL mgda_gn loss)
evo_mgda_stationary_tol: 0.05      # flag Pareto-stationary when ||d|| <= 0.05 max_j ||g_j||
evo_es_fitness_shaping: raw     # keeps the size of each pseudo-gradient, which the min-norm problem compares
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the search mean (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.01
evo_es_sigma_decay: 1.0
evo_es_sigma_min: 0.0
evo_es_antithetic: true
evo_es_grad_cos_freq: 1       # log cosine(pseudo-gradient, backprop gradient); 0 = off
evo_es_grad_save_freq: 50     # save true and pseudo-gradients every 50 generations (scripts/pca_gradients.py)

# Paths
save_path: logs/mnist/20epochs/mo_mgda_loss_openes/pop_8192/adam-lr_1e-3/seed_2/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: evomtl-multimnist
wandb_name: mo_mgda_loss_openes-20epochs-pop_8192-adam-lr_0.001-seed2
wandb_group: mo_mgda_loss_openes-20epochs-pop_8192-adam-lr_0.001
