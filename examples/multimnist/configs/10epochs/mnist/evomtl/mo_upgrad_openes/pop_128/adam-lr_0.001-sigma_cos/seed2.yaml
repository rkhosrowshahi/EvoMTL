# Cosine-annealed sigma: 0.01 -> 1e-4 over the 2344 generations; otherwise the same as mo_upgrad_openes/pop_128/adam-lr_0.001/seed2.yaml.
# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# MO-UPGrad-OpenES: one OpenES pseudo-gradient per objective (each loss ranked separately), combined
# with UPGrad (mean of the projections onto the dual cone); Adam on the search mean. Same settings as
# OpenES (openes/pop_128/adam-lr_0.001/seed1.yaml) apart from the aggregator.

# General
mode: train
seed: 2
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is ES only

# Evolution strategy (MO-UPGrad-OpenES); evo_moea selects the algorithm
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: mo_upgrad_openes
evo_iterations: 2344        # 10 epochs: 2,344 generations x 256 images
evo_pop_size: 128
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 2
upgrad_norm_eps: 0.0001
upgrad_reg_eps: 0.0001
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the search mean (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.01
evo_es_sigma_decay: 1.0
evo_es_sigma_min: 1.0e-4         # floor of the cosine schedule
evo_es_sigma_schedule: cosine    # sigma annealed from evo_es_sigma (0.01) to evo_es_sigma_min over evo_iterations
evo_es_antithetic: true
evo_es_grad_cos_freq: 1       # log cosine(pseudo-gradient, backprop gradient); 0 = off

# Paths
save_path: logs/mnist/10epochs/mo_upgrad_openes/pop_128/adam-lr_1e-3-sigma_cos/seed_2/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: multimnist
wandb_name: mo_upgrad_openes-10epochs-pop_128-adam-lr_0.001-sigma_cos-seed2
wandb_group: mo_upgrad_openes-10epochs-pop_128-adam-lr_0.001-sigma_cos
