# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# MO-UPGrad-GuidedES: one pseudo-gradient per objective, combined with UPGrad (mean of dual-cone
# projections), with Guided ES sampling: the guide is a moving average of past UPGrad directions
# (decay 0.9), perturbed with size 0.05 along it; alpha=0.9 of the noise stays isotropic.
# Adam on the search mean.

# General
mode: train
seed: 1
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is ES only

# Evolution strategy (MO-UPGrad-GuidedES); evo_moea selects the algorithm
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: mo_upgrad_guidedes
evo_iterations: 2344        # 10 epochs: 2,344 generations x 256 images
evo_pop_size: 1024
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 1
upgrad_norm_eps: 0.0001        # UPGrad: Gramian normalization epsilon
upgrad_reg_eps: 0.0001         # UPGrad: Gramian regularization
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the search mean (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.01
evo_es_sigma_decay: 1.0
evo_es_sigma_min: 0.0
evo_es_antithetic: true
evo_es_guided_k: 1            # one guiding direction (the moving average below)
evo_es_guided_alpha: 0.9      # fraction of the noise budget kept isotropic
evo_es_guided_sigma: 0.05     # perturbation size along the guiding direction
evo_es_guided_ema: 0.9        # guide = moving average of past UPGrad directions with this decay
evo_es_grad_cos_freq: 1       # log cosine(pseudo-gradient, backprop gradient); 0 = off

# Paths
save_path: logs/mnist/10epochs/mo_upgrad_guidedes/pop_1024/adam-lr_1e-3/seed_1-s0.05_a0.9_ema0.9/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: multimnist
wandb_name: mo_upgrad_guidedes-10epochs-s0.05_a0.9_ema0.9-pop_1024-adam-lr_0.001-seed1
wandb_group: mo_upgrad_guidedes-10epochs-s0.05_a0.9_ema0.9-pop_1024-adam-lr_0.001
