# 10-epoch protocol (PaMaL's budget): 8 epochs of Adam with EW, then 469 generations x 256 images = 2 epochs of ES.
# Phase 1 (gradient descent): EW, Adam with learning rate 1.0e-3, as in configs/10epochs/mnist/ew.
# Phase 2 (evolution): MO-PSL-TCH-GuidedES from the EW weights, as in psl_guided_es-tch, to shape the Pareto front.
# One run learns a line of networks in weight space, theta(lam) = theta + (lam_1 - lam_2) B, one network per
# preference lam = (lam_1, lam_2), scored with the Chebyshev scalarization max_k lam_k l_k. theta starts at the
# EW network; the front is evaluated on lam_1 = 0, 0.1, ..., 1 at every test evaluation.

# General
mode: train
seed: 1
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting of phase 1
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 8                      # phase 1: 8 epochs of gradient descent

# Optimizer of phase 1 (Adam)
optim: adam
lr: 1.0e-3
weight_decay: 5.0e-4
adam_beta1: 0.9
adam_beta2: 0.999
adam_eps: 1.0e-8
amsgrad: false

# Evolution strategy of phase 2 (MO-PSL-TCH-GuidedES); evo_moea selects the ES code
evo_training: true
evo_schedule: gd_then_evolution  # gradient descent for `epochs`, then evolutionary fine-tuning
evo_moea: psl_es
evo_iterations: 469            # 2 epochs: 469 generations x 256 images
evo_pop_size: 128
evo_num_batches: 1
evo_eval_freq: 50                # unused: evo_eval_per_epoch is set
evo_eval_per_epoch: 2          # test at T/2 and T of every epoch (T = 235 batches), plus the first and last generation
evo_seed: 1
evo_psl_params: all            # parameters that depend on the preference (all, or name prefixes)
evo_psl_scalarization: tch     # score of a member under its preference: tch (Chebyshev) or ws
evo_psl_eval_points: 11        # front evaluated on lam_1 = 0, 0.1, ..., 1
evo_hv_ref_point: [2.302585, 2.302585]  # test hypervolume reference: chance-level loss ln(10) per task
evo_es_lr: 0.0001
evo_es_optim: adam            # optimizer on the search mean (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.001
evo_es_sigma_decay: 1.0
evo_es_sigma_min: 0.0
evo_es_antithetic: true       # required: both members of a pair share one preference
evo_es_guided_k: 1            # one guiding direction (the moving average below)
evo_es_guided_alpha: 0.9      # fraction of the noise budget kept isotropic
evo_es_guided_sigma: 0.05     # perturbation size along the guiding direction
evo_es_guided_ema: 0.9        # guide = moving average of past ES directions with this decay

# Paths
save_path: logs/mnist/10epochs/ew8-psl_guided_es-tch/pop_128/adam-lr_1e-4-sigma_1e-3/seed_1-s0.05_a0.9_ema0.9/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: evomtl-multimnist
wandb_name: ew8-psl_guided_es-tch-10epochs-s0.05_a0.9_ema0.9-pop_128-adam-lr_0.0001-sigma_0.001-seed1
wandb_group: ew8-psl_guided_es-tch-10epochs-s0.05_a0.9_ema0.9-pop_128-adam-lr_0.0001-sigma_0.001
