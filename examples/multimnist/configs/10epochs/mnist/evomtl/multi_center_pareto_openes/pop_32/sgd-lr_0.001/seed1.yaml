# 10-epoch sampled-data protocol: 2344 iterations x 256 images.
# Five persistent centers, 32 probes (16 pairs) per center.
# Same optimizer settings as the short learning check; longer data budget only.
mode: train
seed: 1
gpu_id: '0'
weighting: EW
arch: HPS
rep_grad: false
multi_input: false
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 1000
epochs: 0
evo_training: true
evo_schedule: evolution
evo_moea: multi_center_pareto_openes
evo_iterations: 2344
evo_pop_size: 32
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 1
evo_es_sigma: 0.01
evo_es_lr: 0.001
evo_mc_centers: 5
evo_mc_init_std: 0.001
evo_mc_stats_beta: 0.9
evo_mc_spread_radius: 0.1
evo_mc_tradeoff: 0.01
evo_mc_descent_fraction: 0.5
evo_mc_max_step_norm: 1.0
save_path: logs/mnist/10epochs/multi_center_pareto_openes/pop_32/sgd-lr_0.001/seed_1
wandb_enable: false
