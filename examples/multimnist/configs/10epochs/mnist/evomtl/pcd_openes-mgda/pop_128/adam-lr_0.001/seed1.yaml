# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# PCD-OpenES (MGDA): Pareto-safe common descent OpenES. One OpenES pseudo-gradient per objective
# (raw fitness), combined into the min-norm common descent direction d = -G^T alpha* (MGDA); Adam on the search mean.
# Same settings as OpenES (openes-ws/pop_128/adam-lr_0.001/seed1.yaml) apart from the direction.

# General
mode: train
seed: 1
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is ES only

# Evolution strategy; evo_moea pcd_openes, evo_pcd_direction selects the common descent direction
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: pcd_openes
evo_iterations: 2344        # 10 epochs: 2,344 generations x 256 images
evo_pop_size: 128
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 1
evo_pcd_direction: mgda
evo_pcd_stationary_tol: 0.05      # flag Pareto-stationary when ||d|| <= 0.05 max_j ||g_j||
evo_es_fitness_shaping: raw     # keeps the size of each pseudo-gradient, which the min-norm problem compares
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the search mean (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.01
evo_es_sigma_decay: 1.0
evo_es_sigma_min: 0.0
evo_es_antithetic: true
evo_es_grad_cos_freq: 1       # log cosine(pseudo-gradient, backprop gradient); 0 = off
evo_es_grad_save_freq: 50     # save true and pseudo-gradients every 50 generations (scripts/pca_gradients.py)

# Paths
save_path: logs/mnist/10epochs/pcd_openes-mgda/pop_128/adam-lr_1e-3/seed_1/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: evomtl-multimnist
wandb_name: pcd_openes-mgda-10epochs-pop_128-adam-lr_0.001-seed1
wandb_group: pcd_openes-mgda-10epochs-pop_128-adam-lr_0.001
