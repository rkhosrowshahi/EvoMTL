# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# MO-PSL-TCH-GuidedES: Pareto set learning with Guided ES. One run learns a line of networks in weight space,
# theta(lam) = theta_0 + z + (lam_1 - lam_2) B, one network per preference lam = (lam_1, lam_2).
# Each antithetic pair draws its own preference and is scored with the Chebyshev scalarization
# max_k lam_k l_k; ES searches (z, B) and Adam updates both. The balanced network (lam = 0.5, 0.5)
# is theta_0 + z; the front is evaluated on lam_1 = 0, 0.1, ..., 1 at every test evaluation.
# Split update: the shared delta z (the balanced network) follows the pairs weighted by the Beta(4, 4)
# density of their preference lam_1 (80% of the weight on lam_1 in [0.28, 0.72]); the steering matrix B
# follows all pairs, ranked by Chebyshev scores measured from an ideal point (each task's lowest loss in
# the population on the batch, minus 0.1) instead of from 0.
# Guided ES sampling as in MO-GuidedES-UPGrad: the guide is a moving average of past ES directions
# over (z, B) (decay 0.9), perturbed with size 0.05 along it; alpha=0.9 of the noise stays isotropic.

# General
mode: train
seed: 2
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is ES only

# Evolution strategy (MO-PSL-TCH-GuidedES); evo_moea selects the ES code
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: psl_es
evo_adapter: full
evo_adapter_alpha: 1.0
evo_iterations: 2344        # 10 epochs: 2,344 generations x 256 images
evo_pop_size: 128
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 2
evo_psl_params: all            # parameters that depend on the preference (all, or name prefixes)
evo_psl_scalarization: tch     # score of a member under its preference: tch (Chebyshev) or ws
evo_psl_eval_points: 11        # front evaluated on lam_1 = 0, 0.1, ..., 1
evo_psl_center_a: 4.0         # z update: pair weights = Beta(4, 4) density of lam_1 (1 = equal weights)
evo_psl_spread_score: ideal      # B update: same ranks as z, or Chebyshev from the population's best losses - margin (ideal)
evo_psl_ideal_margin: 0.1
evo_hv_ref_point: [2.302585, 2.302585]  # test hypervolume reference: chance-level loss ln(10) per task
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the search mean (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.01
evo_es_sigma_decay: 1.0
evo_es_sigma_min: 0.0
evo_es_antithetic: true       # required: both members of a pair share one preference
evo_es_guided_k: 1            # one guiding direction (the moving average below)
evo_es_guided_alpha: 0.9      # fraction of the noise budget kept isotropic
evo_es_guided_sigma: 0.05     # perturbation size along the guiding direction
evo_es_guided_ema: 0.9        # guide = moving average of past ES directions with this decay

# Paths
save_path: logs/mnist/10epochs/psl_guided_es-tch-full/pop_128/adam-lr_1e-3/seed_2-s0.05_a0.9_ema0.9-center_4-ideal_pop/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: multimnist
wandb_name: psl_guided_es-tch-full-10epochs-s0.05_a0.9_ema0.9-pop_128-adam-lr_0.001-center_4-ideal_pop-seed2
wandb_group: psl_guided_es-tch-full-10epochs-s0.05_a0.9_ema0.9-pop_128-adam-lr_0.001-center_4-ideal_pop
