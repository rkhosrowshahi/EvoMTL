# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# GuidedES: single-objective Guided ES (Maheswaranathan et al., 2019) on the equal-weight sum
# of the two losses. The guide is a moving average of past search directions (decay 0.9), perturbed
# with size 0.05 along it; alpha=0.9 of the noise stays isotropic. One centered-rank vector,
# one pseudo-gradient, Adam on the search mean.

# General
mode: train
seed: 2
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: fashion
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is ES only

# Evolution strategy (GuidedES on the sum of losses); evo_moea selects the algorithm
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: guidedes
evo_iterations: 2344        # 10 epochs: 2,344 generations x 256 images
evo_pop_size: 128
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 2
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the search mean (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.01
evo_es_sigma_decay: 1.0
evo_es_sigma_min: 0.0
evo_es_antithetic: true
evo_es_guided_k: 1            # one guiding direction (the moving average below)
evo_es_guided_alpha: 0.9      # fraction of the noise budget kept isotropic
evo_es_guided_sigma: 0.05     # perturbation size along the guiding direction
evo_es_guided_ema: 0.9        # guide = moving average of past directions with this decay
evo_es_grad_cos_freq: 1       # log cosine(pseudo-gradient, backprop gradient); 0 = off

# Paths
save_path: logs/fashion/10epochs/guidedes/pop_128/adam-lr_1e-3/seed_2-s0.05_a0.9_ema0.9/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: evomtl-multifashion
wandb_name: guidedes-10epochs-s0.05_a0.9_ema0.9-pop_128-adam-lr_0.001-seed2
wandb_group: guidedes-10epochs-s0.05_a0.9_ema0.9-pop_128-adam-lr_0.001
