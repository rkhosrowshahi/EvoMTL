# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# MO-MGDA-GuidedES: MO-MGDA-OpenES with Guided ES sampling. One OpenES pseudo-gradient per objective
# (raw fitness), combined into the min-norm common descent direction d = -G^T alpha* (MGDA); Adam on the search mean.
# Same settings as mo_mgda_openes/pop_128/adam-lr_0.001 plus Guided ES sampling along the moving average
# of past common directions (as mo_upgrad_guidedes: k=1, alpha=0.9, guided sigma 0.05, ema 0.9).

# General
mode: train
seed: 2
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: fashion
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is ES only

# Evolution strategy (MO-MGDA-GuidedES); evo_moea selects the algorithm, evo_mgda_direction the common descent direction
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: mo_mgda_guidedes
evo_iterations: 2344        # 10 epochs: 2,344 generations x 256 images
evo_pop_size: 128
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 2
evo_mgda_direction: mgda
evo_mgda_grad_norm: none      # raw pseudo-gradients (no loss or norm normalization before MGDA)
evo_mgda_stationary_tol: 0.05      # flag Pareto-stationary when ||d|| <= 0.05 max_j ||g_j||
evo_es_fitness_shaping: raw     # keeps the size of each pseudo-gradient, which the min-norm problem compares
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the search mean (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.01
evo_es_sigma_decay: 1.0
evo_es_sigma_min: 0.0
evo_es_antithetic: true
evo_es_guided_k: 1            # one guiding direction (the moving average below)
evo_es_guided_alpha: 0.9      # fraction of the noise budget kept isotropic
evo_es_guided_sigma: 0.05     # perturbation size along the guiding direction
evo_es_guided_ema: 0.9        # guide = moving average of past MGDA common directions with this decay
evo_es_grad_cos_freq: 1       # log cosine(pseudo-gradient, backprop gradient); 0 = off
evo_es_grad_save_freq: 50     # save true and pseudo-gradients every 50 generations (scripts/pca_gradients.py)

# Paths
save_path: logs/fashion/10epochs/mo_mgda_guidedes/pop_128/adam-lr_1e-3/seed_2/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: evomtl-multifashion
wandb_name: mo_mgda_guidedes-10epochs-pop_128-adam-lr_0.001-seed2
wandb_group: mo_mgda_guidedes-10epochs-pop_128-adam-lr_0.001
