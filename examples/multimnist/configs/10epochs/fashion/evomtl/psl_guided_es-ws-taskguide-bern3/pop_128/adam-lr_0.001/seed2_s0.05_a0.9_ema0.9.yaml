# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# PSL-TaskGuide: one run learns a line of networks theta(lam) = theta + B psi_{w,u}(lam_1 - lam_2), one network per
# preference lam = (lam_1, lam_2). B is not searched: the moving-average difference m_2 - m_1 of the population's
# per-task pseudo-gradients, curvature-normalized. psi is a monotone cubic Bernstein map with a log width w. ES
# searches (theta, w, u), D + 4 dims, with the weighted-sum score lam_1 l_1 + lam_2 l_2 of each pair. The balanced
# network (lam = 0.5, 0.5) is theta; the front is evaluated on lam_1 = 0, 0.1, ..., 1 at every test evaluation.
# Guided ES sampling in span{m_1, m_2, d} (d: moving average of the theta update, decay 0.9), perturbed with size 0.05
# along it; alpha=0.9 of the noise stays isotropic.
# General
mode: train
seed: 2
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: fashion
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is ES only

# Evolution strategy (PSL-TaskGuide); evo_moea selects the ES code
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: psl_taskguide
evo_iterations: 2344        # 10 epochs: 2,344 generations x 256 images
evo_pop_size: 128
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 2
evo_psl_params: all            # parameters that depend on the preference (all, or name prefixes)
evo_psl_scalarization: ws      # score of a member under its preference: tch (Chebyshev) or ws
evo_psl_eval_points: 11        # front evaluated on lam_1 = 0, 0.1, ..., 1
evo_psl_map_degree: 3          # monotone cubic Bernstein preference map (3 search variables)
evo_psl_steering_ema: 0.9      # moving-average decay of the per-task pseudo-gradients (steering + guide)
evo_hv_ref_point: [2.302585, 2.302585]  # test hypervolume reference: chance-level loss ln(10) per task
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the search mean (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.01
evo_es_sigma_decay: 1.0
evo_es_sigma_min: 0.0
evo_es_antithetic: true       # required: both members of a pair share one preference
evo_es_guided_alpha: 0.9      # fraction of the noise budget kept isotropic
evo_es_guided_sigma: 0.05     # perturbation size along each guiding direction
evo_es_guided_ema: 0.9        # decay of the moving average of the theta update (third guide direction)

# Paths
save_path: logs/fashion/10epochs/psl_guided_es-ws-taskguide-bern3/pop_128/adam-lr_1e-3/seed_2-s0.05_a0.9_ema0.9/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: evomtl-multifashion
wandb_name: psl_guided_es-ws-taskguide-bern3-10epochs-s0.05_a0.9_ema0.9-pop_128-adam-lr_0.001-seed2
wandb_group: psl_guided_es-ws-taskguide-bern3-10epochs-s0.05_a0.9_ema0.9-pop_128-adam-lr_0.001
