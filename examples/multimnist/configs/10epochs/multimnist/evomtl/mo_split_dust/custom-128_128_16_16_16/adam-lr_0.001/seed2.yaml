# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# MO-UPGrad-Split-DUST: forward-only training without backpropagation. As MO-UPGrad-DUST, every image's jitter is
# rewarded by its reduction of each task loss separately (one estimated weight gradient per task), but the task
# weights are chosen per weight layer, by UPGrad on a Gramian built only from products of different chunks of draws,
# whose noise cancels in expectation, smoothed over iterations. Same settings as DUST
# (dust/custom-128_128_16_16_16/adam-lr_0.001/seed1.yaml) apart from the aggregation.

# General
mode: train
seed: 2
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is forward-only

# MO-UPGrad-Split-DUST; evo_moea selects the algorithm
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: mo_split_dust
evo_iterations: 2344        # 10 epochs: 2,344 generations x 256 images
evo_pop_size: 128             # unused with evo_dust_allocation: custom
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 2
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the weights (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.05            # jitter std on the layer outputs (activation units)
evo_dust_chunk: 8             # draws per forward pass; rewards centered over them
evo_dust_allocation: custom   # draws per layer from evo_dust_draws
evo_dust_draws: [128, 128, 16, 16, 16]   # conv1, conv2, fc, top-left head, bottom-right head (2+ chunks each)
evo_split_solver: upgrad      # per-layer solver of the task weights (upgrad or mgda)
evo_split_gram_decay: 0.9     # EMA factor of the per-layer cross-chunk Gramians over iterations
upgrad_norm_eps: 0.0001       # UPGrad: epsilon of the Gramian normalization
upgrad_reg_eps: 0.0001        # UPGrad: diagonal regularization of the Gramian
evo_es_grad_cos_freq: 1       # log cosine(per-task estimates / direction, backprop counterparts); 0 = off

# Paths
save_path: logs/multimnist/10epochs/mo_split_dust/custom-128_128_16_16_16/adam-lr_1e-3/seed_2/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: evomtl-multimnist
wandb_name: mo_split_dust-10epochs-custom-128_128_16_16_16-adam-lr_0.001-seed2
wandb_group: mo_split_dust-10epochs-custom-128_128_16_16_16-adam-lr_0.001
