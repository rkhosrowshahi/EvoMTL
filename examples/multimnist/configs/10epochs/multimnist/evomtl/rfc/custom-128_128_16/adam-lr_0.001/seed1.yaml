# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# RFC (readout-frame credit): forward-only. Each generation measures the loss's credit at the shared 50-wide
# representation and at both heads' outputs exactly, by moving every coordinate +- sigma and rerunning the heads
# only (140 head passes); the head weights get their exact local maps. The three encoder layers get independent
# jitter draws, each scored by the linearized readout <credit, h_jittered - h> (encoder passes only, no chunk
# centering). Encoder draws with custom per-layer counts, conv1 128, conv2 128, fc 16 (272 encoder passes): DUST's
# custom-128_128_16_16_16 encoder draws, its 32 head draws replaced by the exact frame. Adam on the sum of the task
# losses, as DUST (dust/custom-128_128_16_16_16/adam-lr_0.001/seed1.yaml).

# General
mode: train
seed: 1
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is forward-only

# DUST; evo_moea selects the algorithm
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: rfc
evo_iterations: 2344        # 10 epochs: 2,344 generations x 256 images
evo_pop_size: 128             # unused with evo_dust_allocation: custom
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 1
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the weights (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.05            # jitter std on the layer outputs (activation units)
evo_dust_chunk: 8             # encoder draws per forward pass (no centering in RFC)
evo_dust_allocation: custom   # draws per encoder layer from evo_dust_draws
evo_dust_draws: [128, 128, 16]   # conv1, conv2, fc (the heads use the frame)
evo_es_grad_cos_freq: 100     # log cosine(RFC estimate, backprop gradient) every 100 generations; 0 = off

# Paths
save_path: logs/multimnist/10epochs/rfc/custom-128_128_16/adam-lr_1e-3/seed_1/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: evomtl-multimnist
wandb_name: rfc-10epochs-custom-128_128_16-adam-lr_0.001-seed1
wandb_group: rfc-10epochs-custom-128_128_16-adam-lr_0.001
