# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# MO-Sum-DUST: forward-only training without backpropagation. As DUST, each generation jitters the output of
# one layer at every image, but rewards each image's jitter with its reduction of every task loss separately:
# one estimated error, and one weight gradient, per task; the update follows their sum. Same settings as DUST
# (dust/pop_128/adam-lr_0.001/seed1.yaml) apart from the rewards; with the same noise the two directions agree
# up to rounding.

# General
mode: train
seed: 1
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is forward-only

# MO-Sum-DUST; evo_moea selects the algorithm
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: mo_sum_dust
evo_iterations: 2344        # 10 epochs: 2,344 generations x 256 images
evo_pop_size: 128             # direct draws (forward passes of the batch) per generation
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 1
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the weights (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.05            # jitter std on the layer outputs (activation units)
evo_dust_chunk: 8             # draws per forward pass; rewards centered over them
evo_dust_allocation: equal    # same draws per layer (width: in proportion to its output size per image)
evo_es_grad_cos_freq: 1       # log cosine(per-task estimates and their sum, backprop gradients); 0 = off

# Paths
save_path: logs/multimnist/10epochs/mo_sum_dust/pop_128/adam-lr_1e-3/seed_1/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: evomtl-multimnist
wandb_name: mo_sum_dust-10epochs-pop_128-adam-lr_0.001-seed1
wandb_group: mo_sum_dust-10epochs-pop_128-adam-lr_0.001
