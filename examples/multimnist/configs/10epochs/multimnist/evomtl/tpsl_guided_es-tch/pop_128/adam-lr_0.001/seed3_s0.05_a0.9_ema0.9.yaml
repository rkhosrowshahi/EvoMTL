# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# MO-TPSL-TCH-GuidedES: Tangent Pareto set learning with Guided ES. One run learns a line of networks in
# weight space, theta(lam) = theta + c (lam_1 - lam_2) T, one network per preference lam = (lam_1, lam_2).
# T = unit(g_2 - g_1) is the Pareto-set tangent from moving averages of the per-task ES gradient estimates
# (not searched), c its learned length. Each antithetic pair draws its own preference and is scored with the
# Chebyshev scalarization max_k lam_k l_k; ES searches theta (Adam) and c (Adam on log c). The balanced network
# (lam = 0.5, 0.5) is theta; the front is evaluated on lam_1 = 0, 0.1, ..., 1 at every test evaluation.
# Guided ES sampling as in MO-PSL-TCH-GuidedES: the guide is a moving average of past ES directions over theta
# (decay 0.9), perturbed with size 0.05 along it; alpha=0.9 of the noise stays isotropic.

# General
mode: train
seed: 3
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is ES only

# Evolution strategy (MO-TPSL-TCH-GuidedES); evo_moea selects the ES code
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: tpsl_es
evo_iterations: 2344        # 10 epochs: 2,344 generations x 256 images
evo_pop_size: 128
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 3
evo_psl_params: all            # parameters that depend on the preference (all, or name prefixes)
evo_psl_scalarization: tch     # score of a member under its preference: tch (Chebyshev) or ws
evo_psl_eval_points: 11        # front evaluated on lam_1 = 0, 0.1, ..., 1
evo_tpsl_c0: 0.1              # initial length c of the line (distance of the end preferences from theta)
evo_tpsl_c_lr: 0.05           # Adam learning rate on log c (0 keeps c fixed)
evo_tpsl_grad_ema: 0.9        # decay of the per-task gradient averages that give the tangent T
evo_hv_ref_point: [2.302585, 2.302585]  # test hypervolume reference: chance-level loss ln(10) per task
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the search mean (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.01
evo_es_sigma_decay: 1.0
evo_es_sigma_min: 0.0
evo_es_antithetic: true       # required: both members of a pair share one preference
evo_es_guided_k: 1            # one guiding direction (the moving average below)
evo_es_guided_alpha: 0.9      # fraction of the noise budget kept isotropic
evo_es_guided_sigma: 0.05     # perturbation size along the guiding direction
evo_es_guided_ema: 0.9        # guide = moving average of past ES directions with this decay

# Paths
save_path: logs/multimnist/10epochs/tpsl_guided_es-tch/pop_128/adam-lr_1e-3/seed_3-s0.05_a0.9_ema0.9/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: evomtl-multimnist
wandb_name: tpsl_guided_es-tch-10epochs-s0.05_a0.9_ema0.9-pop_128-adam-lr_0.001-seed3
wandb_group: tpsl_guided_es-tch-10epochs-s0.05_a0.9_ema0.9-pop_128-adam-lr_0.001
