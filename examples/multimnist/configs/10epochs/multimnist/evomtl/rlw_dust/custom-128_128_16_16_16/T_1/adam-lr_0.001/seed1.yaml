# 10-epoch protocol: about 2,344 mini-batches of 256 images. RLW-DUST trains the 5 layers one at a time, last to first,
# 1 optimizer step(s) each on fresh mini-batches: one iteration = 5 mini-batches, so 468 iterations = 2340 mini-batches.
# Per-step draws as dust/custom-128_128_16_16_16 (forward order).
mode: train
seed: 1
gpu_id: "0"

weighting: EW
arch: HPS
rep_grad: false
multi_input: false

dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0  # No gradient-descent phase.

evo_training: true
evo_schedule: evolution
evo_moea: rlw_dust
evo_iterations: 468              # one pass over the layers each
evo_num_batches: 1
evo_eval_freq: 10               # in iterations
evo_seed: 1
evo_es_lr: 0.001
evo_es_optim: adam
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.05
evo_dust_chunk: 8
evo_dust_allocation: custom
evo_dust_draws: [128, 128, 16, 16, 16]  # conv1, conv2, fc, top-left head, bottom-right head
evo_dust_inner_steps: [1]      # T per layer; or one count per layer in forward order, e.g. [1, 1, 1, 1, 1]
evo_es_grad_cos_freq: 0

save_path: logs/multimnist/10epochs/rlw_dust/custom-128_128_16_16_16/T_1/adam-lr_1e-3/seed_1/
load_path: null
wandb_enable: true
wandb_entity: rasa_research
wandb_project: evomtl-multimnist
wandb_name: rlw_dust-10epochs-custom-128_128_16_16_16-T_1-adam-lr_0.001-seed1
wandb_group: rlw_dust-10epochs-custom-128_128_16_16_16-T_1-adam-lr_0.001
