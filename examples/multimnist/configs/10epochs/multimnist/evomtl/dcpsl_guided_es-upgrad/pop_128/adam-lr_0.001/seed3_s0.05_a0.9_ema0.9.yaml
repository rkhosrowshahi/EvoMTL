# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# MO-DCPSL-UPGrad-GuidedES: Dual-cone Pareto set learning with Guided ES. One run learns a line of networks in
# weight space, theta(lam) = theta + (lam_1 - lam_2) B, one network per preference lam = (lam_1, lam_2).
# No scalarized score: the balanced network theta (lam = 0.5, 0.5) moves along UPGrad, each end theta +- B along
# the projection of its own task gradient onto the dual cone {d : g_k . d >= 0} (the fastest improvement of that
# task that raises the other by nothing, to first order), and B takes half the difference of the end moves.
# Half the antithetic pairs are evaluated at theta, a quarter at each end; each point's gradients come from its own
# pairs, scaled to unit length (equal weight per task). The front is evaluated on lam_1 = 0, 0.1, ..., 1.
# Guided ES sampling: the guide is the two dual-cone edges at theta (moving averages, decay 0.9), perturbed with
# size 0.05 along them; alpha=0.9 of the noise stays isotropic, and the gradients come from that isotropic part.

# General
mode: train
seed: 3
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is ES only

# Evolution strategy (MO-DCPSL-UPGrad-GuidedES); evo_moea selects the ES code
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: dcpsl_es
evo_iterations: 2344        # 10 epochs: 2,344 generations x 256 images
evo_pop_size: 128
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 3
evo_psl_params: all            # parameters that depend on the preference (all, or name prefixes)
evo_psl_eval_points: 11        # front evaluated on lam_1 = 0, 0.1, ..., 1
evo_dcpsl_center_fraction: 0.5  # half the pairs at theta, the rest split between the two ends
evo_dcpsl_normalize: true     # unit-length task gradients before the dual-cone projections (equal weight)
evo_hv_ref_point: [2.302585, 2.302585]  # test hypervolume reference: chance-level loss ln(10) per task
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the search mean (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.01
evo_es_sigma_decay: 1.0
evo_es_sigma_min: 0.0
evo_es_antithetic: true       # required: antithetic pairs at each anchor
evo_es_guided_k: 1            # switches the guide on: the dual-cone edges at theta
evo_es_guided_alpha: 0.9      # fraction of the noise budget kept isotropic
evo_es_guided_sigma: 0.05     # perturbation size along the guiding direction
evo_es_guided_ema: 0.9        # moving averages of the dual-cone edges with this decay

# Paths
save_path: logs/multimnist/10epochs/dcpsl_guided_es-upgrad/pop_128/adam-lr_1e-3/seed_3-s0.05_a0.9_ema0.9/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: true
wandb_project: evomtl-multimnist
wandb_name: dcpsl_guided_es-upgrad-10epochs-s0.05_a0.9_ema0.9-pop_128-adam-lr_0.001-seed3
wandb_group: dcpsl_guided_es-upgrad-10epochs-s0.05_a0.9_ema0.9-pop_128-adam-lr_0.001
