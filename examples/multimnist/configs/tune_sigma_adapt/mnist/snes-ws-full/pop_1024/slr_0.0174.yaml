# SNES: OpenES sampling with one sigma per parameter (evo_es_sigma = initial value), adapted every generation;
# copy of openes-ws-full with the sigma-adaptation keys added.
# 10-epoch protocol (PaMaL's budget): 2344 generations x 256 images = 10 epochs.
# OpenES: single-objective OpenES (Salimans et al., 2017; evosax Open_ES) on the equal-weight
# sum of the two losses. One centered-rank vector, one pseudo-gradient, Adam on the search mean.

# General
mode: train
seed: 1
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is ES only

# Evolution strategy (OpenES); evo_moea selects the ES code, evo_es_aggregator ws = sum of losses
evo_training: true
evo_schedule: moea_then_gd     # ES first, then `epochs` of gradient descent (none here)
evo_moea: mo_openes
evo_adapter: full
evo_adapter_alpha: 1.0
evo_iterations: 100        # tuning run
evo_pop_size: 1024
evo_num_batches: 1
evo_eval_freq: 25
evo_seed: 1
evo_es_aggregator: ws
evo_es_lr: 0.001
evo_es_optim: adam            # optimizer on the search mean (sgd, adam or rmsprop); evo_es_lr is its learning rate
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.01
evo_es_sigma_decay: 1.0
evo_es_sigma_min: 0.0
evo_es_sigma_adapt: snes        # per-parameter sigma (SNES)
evo_es_sigma_lr: 0.0174           # learning rate of the sigma update
evo_es_antithetic: true
evo_es_grad_cos_freq: 1       # log cosine(pseudo-gradient, backprop gradient); 0 = off

# Paths
save_path: logs/mnist/tune_sigma_adapt/snes-ws-full/pop_1024/slr_0.0174/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: false
wandb_project: multimnist
wandb_name: snes-ws-full-10epochs-pop_1024-adam-lr_0.001-seed1
wandb_group: snes-ws-full-10epochs-pop_1024-adam-lr_0.001
