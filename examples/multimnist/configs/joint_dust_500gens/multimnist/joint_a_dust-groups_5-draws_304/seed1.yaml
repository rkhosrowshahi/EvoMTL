# Joint-DUST check at DUST-custom's cost: 304 forward evaluations per generation, 500 generations x 256 images
# (~2.1 epochs), seed 1, W&B off. Joint-A-DUST: all five layers jittered in every pass, 152 antithetic pairs.
# Otherwise as configs/10epochs/multimnist/evomtl/dust/custom-128_128_16_16_16/adam-lr_0.001/seed1.yaml.

# General
mode: train
seed: 1
gpu_id: "0"

# Model (shared LeNet encoder, one head per task)
weighting: EW                  # gradient-descent loss weighting; unused here (epochs: 0)
arch: HPS
rep_grad: false
multi_input: false

# Dataset
dataset: mnist
dataset_path: .
num_tasks: 2
train_bs: 256
test_bs: 10000
epochs: 0                      # no gradient-descent phase: training is forward-only

# evo_moea selects the algorithm
evo_training: true
evo_schedule: evolution        # evolutionary training only, no gradient descent
evo_moea: joint_dust
evo_iterations: 500
evo_pop_size: 128             # unused with evo_dust_allocation: custom
evo_num_batches: 1
evo_eval_freq: 50
evo_seed: 1
evo_es_lr: 0.001
evo_es_optim: adam
evo_es_adam_beta1: 0.9
evo_es_adam_beta2: 0.999
evo_es_adam_eps: 1.0e-8
evo_es_sigma: 0.05            # jitter std on the layer outputs (activation units)
evo_dust_chunk: 8             # evaluations per forward pass
evo_dust_allocation: custom
evo_dust_draws: [304]
evo_dust_groups: [5]           # layers jittered together, in forward order: conv1, conv2, fc, top-left head, bottom-right head
evo_dust_antithetic: true     # flip the jitter of a whole group together (pairs)
evo_es_grad_cos_freq: 1       # log cosine(estimate, backprop gradient); 0 = off

# Paths
save_path: logs/multimnist/joint_dust_500gens/joint_a_dust-groups_5-draws_304/seed_1/
load_path: null

# Weights & Biases
wandb_entity: rasa_research
wandb_enable: false
wandb_project: evomtl-multimnist
wandb_name: joint_a_dust-groups_5-draws_304-500gens-seed1
wandb_group: joint_a_dust-groups_5-draws_304-500gens
